name: GraphOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Analytics Service & Algorithms Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/analytics
        run: |
          python -m pytest tests/python -v

      - name: Run Evaluation Harness Benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}/analytics
        run: |
          python analytics/eval/run_eval.py --output eval/results/results

  test-typescript:
    name: API Gateway & Platform Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci --ignore-scripts

      - name: Prisma Generate
        working-directory: ./api
        run: npx prisma generate

      - name: Run TypeScript Unit Tests
        working-directory: ./api
        run: npx tsx --test tests/unit/*.test.ts
