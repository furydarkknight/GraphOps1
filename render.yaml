services:
  # ─── FastAPI Analytics Service ──────────────────────────────────────────────
  - type: web
    name: graphops-analytics
    env: python
    buildCommand: "pip install -r analytics/requirements.txt"
    startCommand: "cd analytics && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ANALYTICS_INTERNAL_KEY
        generateValue: true

  # ─── Express API Gateway + Integrated Frontend UI ───────────────────────────
  - type: web
    name: graphops-api
    env: node
    buildCommand: "npm --prefix client install && npm --prefix client run build && npm --prefix api install && cd api && npx prisma generate && npm run build"
    startCommand: "cd api && npx prisma db push --accept-data-loss && node dist/src/server.js"
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: PASSPORT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: graphops-db
          property: connectionString
      - key: ANALYTICS_URL
        fromService:
          type: web
          name: graphops-analytics
          property: host

  # ─── Managed PostgreSQL Database ────────────────────────────────────────────
databases:
  - name: graphops-db
    databaseName: graphops
    user: graphops
    plan: free
