services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphops
      POSTGRES_PASSWORD: graphops
      POSTGRES_DB: graphops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphops -d graphops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://graphops:graphops@postgres:5432/graphops?schema=public
      ANALYTICS_URL: http://analytics:8000
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-long}
      PASSPORT_SECRET: ${PASSPORT_SECRET:-dev-passport-secret-32-chars}
      PORT: 3000
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-lite}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ANALYTICS_PORT: 8000
      ANALYTICS_INTERNAL_KEY: ${ANALYTICS_API_KEY:-dev-internal-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
